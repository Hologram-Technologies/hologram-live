name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - run: ./scripts/check-product-boundaries.sh
      # Without --all: every workspace member, but not the vendored crates in
      # third_party/, which are other people's code, kept byte for byte (ADR 032).
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets --locked
      # Several tests create and execute real subprocess fixtures. Serializing
      # them prevents Linux ETXTBSY races while a neighboring fixture is being
      # written, matching the local `just test` gate.
      - run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --package hologram-live --bin hologram
      - run: ./scripts/smoke.sh ./target/release/hologram

  licenses:
    name: Licences
    # The crate is `MIT OR Apache-2.0` (FR-S14). Nothing may enter the graph
    # that cannot ship under both, and both texts must exist to ship with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: test -s LICENSE-MIT && test -s LICENSE-APACHE
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  llamacpp:
    name: llama.cpp feature
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - run: sudo apt-get update
      - run: sudo apt-get install --yes clang cmake libclang-dev
      # No weights are downloaded in CI. This exercises native compilation,
      # backend initialization, feature-only configuration, and error paths;
      # scripts/check-inference-engine.sh is the real-weight acceptance gate.
      - run: cargo test --locked --package hologram-live --features llamacpp --lib inference::llamacpp::tests
      - run: cargo test --locked --package hologram-live --features llamacpp --lib config::tests::llamacpp_requires_the_feature_and_a_model_source
      - run: cargo clippy --locked --package hologram-live --features llamacpp --all-targets -- -D warnings
