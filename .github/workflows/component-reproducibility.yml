name: component-reproducibility

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/component-reproducibility.yml"
      - ".github/workflows/release-server.yml"
      - "scripts/check-python-component-reproducibility.sh"
      - "scripts/compare-python-component-reports.py"
      - "src/compile.rs"
      - "src/holo.rs"
      - "src/holo_python_component.rs"
      - "examples/python-component-dependency/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  clean-build:
    name: ${{ matrix.target }} clean build ${{ matrix.replica }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            replica: a
          - runner: ubuntu-24.04
            target: linux-x86_64
            replica: b
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            replica: a
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            replica: b
          - runner: macos-15
            target: macos-aarch64
            replica: a
          - runner: macos-15
            target: macos-aarch64
            replica: b
          - runner: macos-15-intel
            target: macos-x86_64
            replica: a
          - runner: macos-15-intel
            target: macos-x86_64
            replica: b
          - runner: windows-2025
            target: windows-x86_64
            replica: a
          - runner: windows-2025
            target: windows-x86_64
            replica: b
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.0"
      - name: Install pinned uv without a shared cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Compile and execute once on a clean runner
        shell: bash
        run: ./scripts/check-python-component-reproducibility.sh --build-count 1 --report component-report.json --archive component.holo
      - uses: actions/upload-artifact@v7
        with:
          name: component-${{ matrix.target }}-${{ matrix.replica }}
          path: |
            component-report.json
            component.holo
          if-no-files-found: error

  compare:
    name: Compare all clean component builds
    needs: clean-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: component-*
          path: component-reports
      - name: Compare canonical and physical identities by native host
        run: |
          set +e
          python3 scripts/compare-python-component-reports.py \
            --expected-replicas 2 \
            component-reports/*/component-report.json > component-matrix.json
          comparison_status=$?
          set -e
          jq . component-matrix.json
          exit "${comparison_status}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: component-reproducibility-matrix
          path: component-matrix.json
          if-no-files-found: error
