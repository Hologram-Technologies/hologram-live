name: model-hub-uptime

# Probes hub.uor.foundation from outside its host. One open issue per outage: opened on the first failure,
# commented on while it lasts, closed on recovery.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-hub-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/model-hub/deploy
          sparse-checkout-cone-mode: false

      # uptime.mjs checks the site, the registry, the server, that the pointer names a catalog, that the catalog and a
      # model hash to their addresses (BLAKE3: hash-wasm, pinned), that the daily publish is fresh, and that the doors
      # that must stay closed are closed. A probe that cannot start is an outage too.
      - name: Probe site, registry, server and hub
        id: probe
        working-directory: apps/model-hub/deploy
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error hash-wasm@4.12.0
          node uptime.mjs https://hub.uor.foundation || echo "failures=probe-crashed" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.probe.outputs.failures }}
        run: |
          title="Model Hub outage: hub.uor.foundation"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$FAILURES" ]; then
            if [ -z "$open" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Probe failed: \`$FAILURES\` ($run_url). Host runbook: apps/model-hub/deploy/README.md."
            else
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing: \`$FAILURES\` ($run_url)"
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Recovered ($run_url)."
          fi
