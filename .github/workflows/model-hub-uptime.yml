name: model-hub-uptime

# Probes the hub (env HUB below) from outside its host. One open issue per outage: opened on the first failure,
# commented on while it lasts, closed on recovery.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-hub-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      HUB: https://gethologram.ai
    steps:
      - name: Probe site and registry
        id: probe
        run: |
          set -u
          fail=""
          check() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 --retry 2 --retry-delay 10 "$2" || echo 000)
            echo "$1 $code"
            [ "$code" = 200 ] || fail="$fail $1=$code"
          }
          check site $HUB/
          check browse $HUB/models/
          check model-page $HUB/models/hexgrad/Kokoro-82M/
          check registry $HUB/v2/
          check index-tags $HUB/v2/model-hub/index/tags/list
          grep -q '"tags":\[' /tmp/body || fail="$fail index-tags=empty"
          # A tag that lists is not a tag that pulls: ask for the newest one's
          # manifest, as a client would, and head one of the blobs it names.
          tag=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/body | tail -1)
          if [ -n "$tag" ]; then
            code=$(curl -s -o /tmp/manifest -w "%{http_code}" --max-time 20 -H 'Accept: application/vnd.oci.image.manifest.v1+json' "$HUB/v2/model-hub/index/manifests/$tag" || echo 000)
            echo "index-manifest $code"
            [ "$code" = 200 ] || fail="$fail index-manifest=$code"
            digest=$(grep -o '"digest":"[^"]*"' /tmp/manifest | head -1 | cut -d'"' -f4)
            if [ -n "$digest" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -I "$HUB/v2/model-hub/index/blobs/$digest" || echo 000)
              echo "index-blob $code"
              [ "$code" = 200 ] || fail="$fail index-blob=$code"
            fi
          else
            fail="$fail index-tags=no-dated-tag"
          fi
          # Discovery and management surfaces a client relies on, read-only.
          check catalog https://hub.uor.foundation/v2/_catalog
          grep -q '"repositories":\[' /tmp/body || fail="$fail catalog=shape"
          # The catalogue's own index is blake3-addressed; a standard client
          # needs the sha256 name of the same bytes (ADR 030). Prove the alias
          # is served, or `docker pull` is a promise the registry cannot keep.
          if [ -n "${digest:-}" ]; then
            curl -s -o /tmp/blob --max-time 60 "https://hub.uor.foundation/v2/model-hub/index/blobs/$digest" || true
            alias=$(sha256sum /tmp/blob | cut -c1-64)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -I "https://hub.uor.foundation/v2/model-hub/index/blobs/sha256:$alias" || echo 000)
            echo "sha256-alias $code"
            [ "$code" = 200 ] || fail="$fail sha256-alias=$code"
          fi
          # A model served as an OCI artifact must answer with sha256 layers,
          # which is what crane, oras and docker can pull. Ask as they would.
          code=$(curl -s -o /tmp/model -w "%{http_code}" --max-time 20 -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://hub.uor.foundation/v2/convaiinnovations/laya/manifests/latest" || echo 000)
          echo "model-manifest $code"
          [ "$code" = 200 ] || fail="$fail model-manifest=$code"
          grep -q '"digest":"sha256:' /tmp/model || fail="$fail model-manifest=no-sha256-layer"
          mdigest=$(curl -s -o /dev/null -D - --max-time 20 -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://hub.uor.foundation/v2/convaiinnovations/laya/manifests/latest" | grep -i '^docker-content-digest:' | cut -d' ' -f2 | tr -d '[:cntrl:]')
          if [ -n "$mdigest" ]; then
            code=$(curl -s -o /tmp/refs -w "%{http_code}" --max-time 20 "https://hub.uor.foundation/v2/convaiinnovations/laya/referrers/$mdigest" || echo 000)
            echo "referrers $code"
            [ "$code" = 200 ] || fail="$fail referrers=$code"
            grep -q '"mediaType":"application/vnd.oci.image.index.v1+json"' /tmp/refs || fail="$fail referrers=not-an-index"
          fi
          echo "failures=${fail# }" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the outage issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.probe.outputs.failures }}
        run: |
          title="Model Hub outage: ${HUB#https://}"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$FAILURES" ]; then
            if [ -z "$open" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Probe failed: \`$FAILURES\` ($run_url). Host runbook: apps/model-hub/deploy/README.md."
            else
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing: \`$FAILURES\` ($run_url)"
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Recovered ($run_url)."
          fi
