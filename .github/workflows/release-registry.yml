name: release-registry

# Hologram Registry's image, published to GHCR on a `registry-v*` tag.
# The tag is the version: `registry-v1.0.0` publishes 1.0.0, 1.0, 1 and latest.
# Nothing is pushed until the image passes the same gate CI runs on every
# change (`apps/registry/gates/image/check-image.sh`): a build the registry
# cannot serve from cannot ship.

on:
  push:
    tags:
      - "registry-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as 1.0.0 (a dry run: builds and gates, publishes nothing)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, gate, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: The version this tag publishes
        id: version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            version=${GITHUB_REF_NAME#registry-v}
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          version=$(grep -m1 version= "$GITHUB_OUTPUT" | cut -d= -f2)
          image=ghcr.io/hologram-technologies/registry
          {
            echo 'tags<<EOF'
            echo "$image:$version"
            echo "$image:${version%.*}"
            echo "$image:${version%%.*}"
            echo "$image:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: The tag's version is the crate's version
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "$crate" = "${{ steps.version.outputs.version }}" ] ||
            { echo "tag says ${{ steps.version.outputs.version }}, Cargo.toml says $crate"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner, to gate it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/registry/Dockerfile
          tags: hologram-registry:release
          load: true
          cache-from: type=gha,scope=registry-image
          cache-to: type=gha,scope=registry-image,mode=max

      - name: The image gate (metadata, surface, push and pull, clean stop, restart)
        run: apps/registry/gates/image/check-image.sh hologram-registry:release

      - name: The deployment guide, with only the image changed
        env:
          SWAP_TRUST: sudo
        run: apps/registry/gates/clients/compose-swap.sh hologram-registry:release

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/registry/Dockerfile
          push: true
          # amd64 today. arm64 is built natively once an arm runner is
          # available: under emulation the Rust build takes hours (P10).
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=registry-image
          tags: ${{ steps.version.outputs.tags }}

      - name: What was published
        if: steps.version.outputs.publish == 'true'
        run: |
          echo "ghcr.io/hologram-technologies/registry:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "docker run -d -p 5000:5000 ghcr.io/hologram-technologies/registry:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
