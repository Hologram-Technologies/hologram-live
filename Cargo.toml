[package]
name = "hologram-live"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Extensible local and remote module host for Hologram"
repository = "https://github.com/Hologram-Technologies/hologram-live"
default-run = "hologram"
publish = false

[workspace]
members = [
    "crates/hologram-application-watch",
    "crates/hologram-client",
    "crates/hologram-view-surface",
]
resolver = "2"
# The gate tools judge the binary from outside; cargo must not claim them.
# Vendored store crates are built as dependencies, never linted, formatted or tested as ours.
exclude = ["apps/registry/gates/differential", "third_party/kappa/crates", "third_party/dcbor"]

[lib]
name = "hologram_live"
path = "src/lib.rs"

[[bin]]
name = "hologram"
path = "src/main.rs"

# Test helper for tests/oci_store.rs: a process to kill mid-upload. Never shipped.
[[bin]]
name = "oci_child"
path = "tests/support/oci_child.rs"
required-features = ["oci"]
test = false
doc = false

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1", "http2"] }
blake3 = "1"
bytes = { version = "1", optional = true }
# The reference registry's config.yml, read into a flat key table (src/registry_compat).
yaml-rust2 = { version = "0.13", optional = true, default-features = false }
bcrypt = { version = "0.19", optional = true }
getrandom = "0.4"
base64 = { version = "0.23", optional = true }
# TLS on the registry's listener (http.tls). ring only: aws-lc stays out of the graph.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
# Already locked through tonic and reqwest; the registry streams blob bodies with `ReaderStream`.
tokio-util = { version = "0.7", features = ["io"], optional = true }
kappa-core = { path = "third_party/kappa/crates/kappa-core", optional = true, default-features = false }
kappa-store-redb = { path = "third_party/kappa/crates/kappa-store-redb", optional = true, default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
# dyn-dispatched async for the ClusterNetwork trait. Already in the graph
# through tonic and opentelemetry, so a direct declaration adds no crate.
async-trait = "0.1"
# Per-node cluster identity. The public key is the node_id, and in Phase 2 the
# same 32 secret bytes construct the iroh SecretKey, so identity is continuous
# across the transport change. BSD-3-Clause; already in Cargo.lock as a
# transitive, so this does not move the lock.
ed25519-dalek = { version = "3", default-features = false }
fs4 = "1.1"
hyper-util = { version = "0.1", features = ["tokio"] }
kameo = "0.22"
encoding_rs = { version = "0.8", optional = true }
llama-cpp-2 = { version = "=0.1.156", optional = true, default-features = false }
candle-core = { version = "0.11", optional = true, default-features = false }
candle-transformers = { version = "0.11", optional = true, default-features = false }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }
burn = { version = "0.18", optional = true, default-features = false, features = ["std", "ndarray"] }
burn-lm-inference = { version = "0.0.1", optional = true, default-features = false, features = ["legacy-v018"] }
burn-lm-llama = { version = "0.0.1", optional = true, default-features = false, features = ["inference-server", "pretrained", "llama3"] }
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "metrics", "trace", "tls-ring", "tls-roots"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
prost = "0.14"
# `rustls-no-provider` rather than `rustls`: the latter forces the aws-lc-rs
# crypto provider, which is C code. This tree standardizes on ring (see the
# `tls-ring` features on tonic and opentelemetry-otlp), so rustls resolves ring
# from crate features and the default build stays pure Rust. Roots now come from
# rustls-platform-verifier, which 0.13 uses in place of the removed roots features.
redb = { version = "4", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "blocking", "stream"] }
scalar_api_reference = { version = "0.2.2", default-features = false }
# Direct only to choose a crypto provider. reqwest 0.13 requires one to be
# installed explicitly under `rustls-no-provider`; default features here would
# pull aws-lc-rs back in, so ring is selected deliberately. See
# `util::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = "0.8"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
utoipa = { version = "5", features = ["axum_extras"] }
wasmtime = "48"
zstd = "0.13"

# The only domain dependency. This revision adds the append-only `.holo` v4
# `InferenceModel` layer. Live accepts only the current v4 archive contract. The stable default still
# uses only the canonical archive/space surface: model compilation and runtime
# providers remain outside this crate until their typed adapters are enabled.
hologram = { package = "uor-hologram", git = "https://github.com/Hologram-Technologies/hologram", rev = "2bda6a9a9476872dade705bd61ece4209607f6da", default-features = false, features = ["archive", "space"] }
hologram-view-surface = { path = "crates/hologram-view-surface" }
# Bearer tokens for `auth.token`, registry only.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"], optional = true }
ring = { version = "0.17.14", optional = true }

[dev-dependencies]
cucumber = "0.23"
# Dev-only: the client SDK mirrors the wire shapes rather than importing them,
# so a contract test asserts the two still agree. A dev-dependency keeps it out
# of the server's normal dependency graph, which the product-boundary gate
# checks with --edges normal.
hologram-client = { path = "crates/hologram-client" }

[features]
bdd = []
# In-process GGUF execution. Off by default because it compiles llama.cpp and
# gives native model code the daemon's process boundary.
llamacpp = ["dep:encoding_rs", "dep:llama-cpp-2"]
llamacpp-cuda = ["llamacpp", "llama-cpp-2/cuda"]
llamacpp-metal = ["llamacpp", "llama-cpp-2/metal"]
# Rust-native GGUF execution through Hugging Face Candle. The initial adapter is
# deliberately limited to Llama-family decoder models and requires an external
# tokenizer.json; unsupported architectures fail during startup.
candle = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
candle-cuda = ["candle", "candle-core/cuda", "candle-transformers/cuda"]
candle-metal = ["candle", "candle-core/metal", "candle-transformers/metal"]
# Burn-LM's Llama implementation. Burn checkpoints are not GGUF files: this
# engine consumes a converted named-MPK checkpoint plus a tokenizer.model.
burn = ["dep:burn", "dep:burn-lm-inference", "dep:burn-lm-llama"]
# Hologram Registry (apps/registry). Off by default: a stock build pulls no Kappa crate.
oci = ["dep:jsonwebtoken", "dep:ring", "dep:kappa-core", "dep:kappa-store-redb", "dep:redb", "dep:bytes", "dep:tokio-util", "dep:yaml-rust2", "dep:bcrypt", "dep:base64", "dep:tokio-rustls", "hyper-util/server-auto", "hyper-util/server-graceful", "hyper-util/service", "hyper-util/http1", "hyper-util/http2"]
ring = ["dep:ring"]

[[test]]
name = "oci_store"
required-features = ["oci"]

[[test]]
name = "cluster_e2e"

[[test]]
name = "oci_http"
required-features = ["oci"]

[[test]]
name = "oci_login"
required-features = ["oci"]

[[test]]
name = "oci_tls"
required-features = ["oci"]

[[test]]
name = "oci_verify"
required-features = ["oci"]

[[test]]
name = "oci_debug"
required-features = ["oci"]

[[test]]
name = "oci_token"
required-features = ["oci"]

[[test]]
name = "oci_provider"
required-features = ["oci"]

[[test]]
name = "oci_gc"
required-features = ["oci"]

[[test]]
name = "oci_import"
required-features = ["oci"]

[[test]]
name = "bdd"
harness = false
required-features = ["bdd"]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# These are deliberate API-shape/documentation tradeoffs for the application
# crate; all other pedantic lints remain enabled.
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
unused_async = "allow"
