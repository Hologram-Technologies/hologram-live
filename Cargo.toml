[package]
name = "hologram-live"
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Extensible local and remote module host for Hologram"
repository = "https://github.com/Hologram-Technologies/hologram-live"
default-run = "hologram"
publish = false

[workspace]
members = [
    "crates/hologram-application-watch",
    "crates/hologram-view-surface",
]
resolver = "2"

[lib]
name = "hologram_live"
path = "src/lib.rs"

[[bin]]
name = "hologram"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1", "http2"] }
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
fs4 = "1.1"
hyper-util = { version = "0.1", features = ["tokio"] }
kameo = "0.22"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "metrics", "trace", "tls-ring", "tls-roots"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scalar_api_reference = { version = "0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
utoipa = { version = "5", features = ["axum_extras"] }
wasmtime = "46"
zstd = "0.13"

# The only domain dependency. This revision adds the append-only `.holo` v4
# `InferenceModel` layer. Live accepts only the current v4 archive contract. The stable default still
# uses only the canonical archive/space surface: model compilation and runtime
# providers remain outside this crate until their typed adapters are enabled.
hologram = { package = "uor-hologram", git = "https://github.com/Hologram-Technologies/hologram", rev = "4fac0b3151626bac524b46451f066e7d077201c9", default-features = false, features = ["archive", "space"] }
hologram-view-surface = { path = "crates/hologram-view-surface" }

[dev-dependencies]
cucumber = "0.23"

[features]
bdd = []

[[test]]
name = "bdd"
harness = false
required-features = ["bdd"]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# These are deliberate API-shape/documentation tradeoffs for the application
# crate; all other pedantic lints remain enabled.
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
unused_async = "allow"
