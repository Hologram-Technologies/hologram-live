[package]
name = "hologram-desktop"
version = "1.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
