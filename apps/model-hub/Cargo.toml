[package]
name = "hologram-model-hub"
version = "0.1.0"
edition = "2021"
publish = false
description = "Model Hub: list, pull, verify and remove named artifacts from a portable View."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace]
