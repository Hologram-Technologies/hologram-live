# gethologram.ai: Model Hub site + Kappa Registry, fronted by the existing twenty Caddy.
# Lives at /root/hub on the VPS. Joins twenty_default so Caddy reaches both services by name.
name: hub

services:
  kappa:
    image: debian:bookworm-slim
    restart: unless-stopped
    command: ["/usr/local/bin/kappa-server"]
    environment:
      KAPPA_LISTEN_ADDR: 0.0.0.0:5000
      KAPPA_STORE_ROOT: /data
      # Writes are gated at Caddy (bearer token); the registry itself stays permissive so public reads need no token.
      KAPPA_AUTH_REQUIRED: "false"
      # Refuse writes before the shared disk gets tight.
      KAPPA_DISK_PRESSURE_THRESHOLD_MB: "8192"
      KAPPA_MAX_BLOB_SIZE: "1181116006" # 1.1 GiB: the largest curated model file is 988 MB
    volumes:
      - ./bin/kappa-server:/usr/local/bin/kappa-server:ro
      - ./store:/data
      # The registry builds an outbound HTTPS client at startup and needs the system CA bundle.
      - /etc/ssl/certs:/etc/ssl/certs:ro
    mem_limit: 1g
    cpus: 1.5
    networks:
      default:
        aliases: [hub-kappa]

  site:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ./site:/srv:ro
      - ./archive:/srv/archive:ro
    mem_limit: 128m
    networks:
      default:
        aliases: [hub-site]

  hologram:
    image: debian:bookworm-slim
    restart: unless-stopped
    command: ["/usr/local/bin/hologram", "serve"]
    environment:
      HOLOGRAM_CONFIG: /etc/hologram/live.toml
      HOLOGRAM_AUTH_TOKEN: ${HOLOGRAM_AUTH_TOKEN}
      HOME: /var/lib/hologram
    volumes:
      - ./bin/hologram:/usr/local/bin/hologram:ro
      - ./hologram/live.toml:/etc/hologram/live.toml:ro
      - ./hologram/state:/var/lib/hologram
      - /etc/ssl/certs:/etc/ssl/certs:ro
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    depends_on: [kappa]
    networks:
      default:
        aliases: [hub-server]

  # The Hugging Face dialect (HF_ENDPOINT=https://gethologram.ai): metadata from the published file lists, every
  # file request answered with a redirect to a live source. No weight byte passes through it.
  resolve:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/hub-resolve.mjs"]
    environment:
      HUB_DATA: /data
      HUB_STATE: /state
    volumes:
      - ./bin/hub-resolve.mjs:/app/hub-resolve.mjs:ro
      - ./bin/kappa-mirror.mjs:/app/kappa-mirror.mjs:ro
      - ./site/data:/data:ro
      - ./state/resolve:/state
    mem_limit: 96m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
    networks:
      default:
        aliases: [hub-resolve]

  # Sign-in. Only people who chose to sign in ever reach it: every read surface of the hub stays anonymous. It
  # verifies the Privy access token itself (ES256, no npm dependencies, like hub-resolve) and keeps one small record
  # per person, keyed by a hash of their Privy identifier.
  account:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/hub-account.mjs"]
    environment:
      HUB_ACCOUNT_STATE: /state
      PRIVY_VERIFICATION_KEY_FILE: /run/privy-key.pem
    # PRIVY_APP_ID only. The key is a file next to it, because a PEM does not survive an env file intact.
    # With neither, the service answers /api/account/health and refuses the rest, so the hub still starts.
    env_file:
      - ./privy.env
    volumes:
      - ./bin/hub-account.mjs:/app/hub-account.mjs:ro
      - ./privy-verification-key.pem:/run/privy-key.pem:ro
      - ./state/account:/state
    mem_limit: 96m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
    networks:
      default:
        aliases: [hub-account]

networks:
  default:
    name: twenty_default
    external: true
