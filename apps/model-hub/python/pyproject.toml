[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hologram-verify"
version = "0.1.0"
description = "Every file huggingface_hub hands your code is checked against Hologram's κ index first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["huggingface_hub>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]
