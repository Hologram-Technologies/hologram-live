<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registry · Hologram Models Hub</title>
<meta name="description" content="Container images from every registry we can read, in one index you can rebuild yourself.">
<link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Geist";src:url("/fonts/Geist-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist";src:url("/fonts/Geist-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("/fonts/GeistMono-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --ground:#151312; --surface:#1c1a19; --fill:#2a2725; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#f6f5f4; --dim:#a6a4a2; --faint:#757371; --brand:#e93b01; --ok:#63b98a;
  --mono:'Geist Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,p,ul{margin:0}ul{list-style:none;padding:0}
[hidden]{display:none !important}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.top{height:68px;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.sep{width:1px;height:24px;background:var(--line2)}
.nav{display:flex;gap:4px}
.nav a{padding:7px 13px;border-radius:8px;font-size:15px;color:var(--dim)}
.nav a[aria-current]{color:var(--text);background:var(--fill)}
.endpoint{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line2);
  border-radius:8px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}

.lead{display:flex;align-items:baseline;gap:12px;padding:30px 0 18px}
.lead h1{font-size:30px;font-weight:500;letter-spacing:-.02em}
.pill{height:26px;display:inline-flex;align-items:center;padding:0 10px;border-radius:7px;background:var(--fill);font-size:13.5px;color:var(--dim)}
.lead p{margin-left:auto;font-size:13px;color:var(--faint)}

.caps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:20px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.caps li{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.caps .k{font-size:12.5px;color:var(--dim)}
.caps .v{display:flex;align-items:center;gap:8px;font-size:13.5px}
.caps .v b{font-weight:400}
.dot{width:7px;height:7px;border-radius:999px;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.caps li[data-state="ready"] .dot{background:var(--ok)}
.caps li[data-state="token"] .dot{background:var(--brand)}
.caps li[data-state="off"] .v b{color:var(--faint)}
@media (max-width:900px){.caps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card.ours{border-color:rgba(233,59,1,.35)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@media (min-width:1024px){.cols{grid-template-columns:minmax(18.75rem,23.75rem) minmax(0,1fr)}}

/* the filter rail, matching the models page rule for rule */
.rail{background:var(--surface);border-radius:10px;padding:16px 16px 48px;position:sticky;top:24px;
  max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--fill) transparent}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0;min-width:0;
  border:1px solid transparent;border-radius:8px;font-size:14px;color:var(--dim);
  transition:color 150ms cubic-bezier(.4,0,.2,1),background 150ms cubic-bezier(.4,0,.2,1),border-color 150ms cubic-bezier(.4,0,.2,1)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);background:var(--fill);border-color:var(--line2)}
.sections{display:grid;gap:24px;padding-top:16px}
.facet{display:grid;gap:12px}
.facet header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.facet h2{font-size:14px;color:var(--dim);font-weight:400}
.facet .reset{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);
  border-radius:8px;font-size:14px;color:var(--dim)}
.facet .reset:hover{color:var(--text);border-color:var(--line2)}
.facet .reset[disabled]{opacity:.45}
.facet-tools{display:flex;gap:8px}
.facet-tools .field{flex:1;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;
  border:1px solid var(--line2);border-radius:8px}
.facet-tools .field input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:14px;color:var(--text)}
.facet-tools .square{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;overflow:hidden;transition:max-height 200ms cubic-bezier(.4,0,.2,1)}
.chips.clamped{max-height:calc(32px * 3 + 8px * 2)}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;height:32px;padding:0 4px 0 12px;
  border:1px solid var(--line2);border-radius:8px;font-size:14px;color:var(--text);
  transition:border-color 150ms,background 150ms,color 150ms}
.chip .i{color:var(--dim);flex:none}
.chip .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:#757371}
.chip.ours{border-color:rgba(233,59,1,.5);box-shadow:inset 2px 0 0 var(--brand)}
.chip.ours .i{color:var(--brand)}
.chip.ours[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:none}
.chip.ours[aria-pressed="true"] .i{color:#fff}
.chip.ours[aria-pressed="true"] .n{background:rgba(0,0,0,.22);color:#fff}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
.chip[aria-pressed="true"] .i{color:var(--ground)}
.chip .n{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:24px;
  background:var(--fill);color:var(--text);font-family:var(--mono);font-size:12.5px}
.chip[aria-pressed="true"] .n{background:color-mix(in srgb, var(--ground) 14%, transparent);color:var(--ground)}
.more{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:14px}
.more:hover{color:var(--text);border-color:var(--line2)}
.note{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}

.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.search{flex:1;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;background:var(--surface);
  border:1px solid var(--line2);border-radius:11px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:15px;color:var(--text)}
.sort{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--dim);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;display:grid;
  grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto 1fr auto;gap:4px 14px;min-height:140px}
.card img.logo{grid-row:1/3;width:40px;height:40px;border-radius:9px;object-fit:contain;background:var(--ground)}
.card .tags,.card h3,.card p,.card .foot{grid-column:2}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;border:1px solid var(--line2);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.tag.here{border-color:rgba(99,185,138,.45);color:var(--ok)}
.tag.official{border-color:rgba(233,59,1,.45);color:#f0855c}
.card h3{font-family:var(--mono);font-size:15px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;display:flex;gap:12px;font-size:12px;color:var(--faint)}
.empty{padding:40px 0;color:var(--faint);font-size:14px}
.card{cursor:pointer;text-align:left}
.card:hover{border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:41;background:var(--surface);
  border-left:1px solid var(--line);padding:24px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sheet .x{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:8px;color:var(--dim);font-size:20px;line-height:1}
.sheet .x:hover{color:var(--text);background:var(--fill)}
.sheet-head{display:flex;gap:14px;align-items:flex-start;padding-right:36px}
.sheet .cover{width:48px;height:48px;border-radius:10px;object-fit:contain;background:var(--ground);flex:none}
.sheet h2{font-family:var(--mono);font-size:17px;font-weight:500;word-break:break-all}
.sheet .muted{font-size:13px;color:var(--dim);margin-top:6px}
.sheet .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
.sheet .facts div{min-width:0}
.sheet .facts dt{font-size:11.5px;color:var(--faint)}
.sheet .facts dd{margin:3px 0 0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.sheet-foot{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid var(--line2);
  border-radius:9px;font-size:14px;color:var(--text)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.cmdbox{display:flex;flex-direction:column;gap:6px}
.cmdbox .lbl{font-size:12px;color:var(--faint)}
.cmdline{display:flex;align-items:center;gap:8px;padding:10px 10px;background:var(--ground);
  border:1px solid var(--line);border-radius:9px}
.cmdline code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;overflow:auto;white-space:nowrap}
.copy{height:28px;padding:0 10px;border-radius:7px;background:var(--fill);font-size:12.5px;color:var(--dim);flex:none}
.copy:hover{color:var(--text)}
#more{margin:18px auto 0;display:block;width:auto;height:40px;padding:0 18px;border:1px solid var(--line2);border-radius:9px;color:var(--dim);font-size:14px}
.foot-note{margin-top:44px;padding:20px 0 40px;border-top:1px solid var(--line);font-size:13px;color:var(--faint);display:flex;gap:20px;flex-wrap:wrap}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top"><div class="wrap" style="display:flex;align-items:center;gap:18px;width:100%">
  <a class="brand" href="/"><img src="/logos/Hologram_Logomark_White.svg" alt="" width="28" height="28"><img src="/logos/Hologram_Wordmark_White.svg" alt="Hologram" height="13"></a>
  <span class="sep"></span>
  <nav class="nav" aria-label="Sections">
    <a href="/">Models</a><a href="#/" aria-current="page">Registry</a>
  </nav>
  <span class="endpoint"><span class="dot" id="dot"></span><span id="host">…</span></span>
</div></header>

<main class="wrap">
  <div class="lead"><h1>Registry</h1><span class="pill" id="count">…</span><p id="prov"></p></div>

  <ul class="caps" id="caps" aria-label="What our registry answers">
    <li data-cap="pull"><span class="k">OCI Pull</span><span class="v"><i class="dot"></i><b>…</b></span></li>
    <li data-cap="push"><span class="k">OCI Push</span><span class="v"><i class="dot"></i><b>…</b></span></li>
    <li data-cap="discovery"><span class="k">OCI Content Discovery</span><span class="v"><i class="dot"></i><b>…</b></span></li>
    <li data-cap="management"><span class="k">OCI Content Management</span><span class="v"><i class="dot"></i><b>…</b></span></li>
  </ul>

  <div class="cols">
    <aside class="rail" id="rail"></aside>
    <section>
      <div class="bar">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#757371" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="q" type="search" placeholder="Search, or paste a reference like nginx:1.27 or a sha256 digest" autocomplete="off">
        </label>
        <select class="sort" id="sort">
          <option value="pulls">Most pulled</option>
          <option value="stars">Most starred</option>
          <option value="name">Name</option>
        </select>
      </div>
      <p id="resolved" class="empty" hidden></p>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>Show more</button>
      <p class="empty" id="empty" hidden>Nothing matches those filters.</p>
    </section>
  </div>

  <footer class="foot-note">
    <span>Rows marked <b style="color:var(--ok);font-weight:400">HERE</b> are derived from our own registry and carry a digest you can check.</span>
    <span id="sources"></span>
  </footer>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Details">
  <button class="x" id="sheet-close" aria-label="Close">&#215;</button>
  <div class="sheet-head">
    <img class="cover" id="s-logo" alt="">
    <div style="min-width:0">
      <div class="tags" id="s-tags"></div>
      <h2 id="s-name"></h2>
      <p class="muted" id="s-desc"></p>
    </div>
  </div>
  <div class="cmdbox" id="s-cmdbox">
    <span class="lbl" id="s-cmdlabel">Pull it</span>
    <div class="cmdline"><code id="s-cmd"></code><button class="copy" id="s-copy">Copy</button></div>
  </div>
  <dl class="facts" id="s-facts"></dl>
  <div class="sheet-foot">
    <a class="btn" id="s-home" target="_blank" rel="noopener">Open on source</a>
    <a class="btn" id="s-here" hidden>Check it here</a>
  </div>
</aside>

<script type="module" src="app.js"></script>
</body>
</html>
