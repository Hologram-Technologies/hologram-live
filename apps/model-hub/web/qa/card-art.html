<!doctype html>
<html lang="en" class="dark" data-base="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card art · Hologram Models Hub</title>
<link rel="stylesheet" href="/kit/hologram-warm.css">
<link rel="stylesheet" href="/kit/hologram-gap-tokens.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/styles.css">
<style>
  .lab { display: grid; gap: var(--space-6); margin-top: var(--space-6); }
  .variant header { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-3); }
  .variant h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: var(--weight-medium); }
  .variant p { font-size: var(--text-sm); color: var(--hh-text-dim); }
  .variant .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .variant .grid { grid-template-columns: minmax(0, 1fr); } }
  .card .art { width: 55%; opacity: 1; }
  .card .art.v-hologram { width: 40%; opacity: .08; }
  .card:hover .art { opacity: 1; }
  .card .art .ln { stroke: var(--hh-text); fill: none; }
  .card .art .nd { fill: var(--hh-text); }
  .card .art .hot { fill: var(--hh-ok); }
  .card .art .hotln { stroke: var(--hh-ok); fill: none; }
</style>
</head>
<body>
<div class="shell">
  <header class="top"><span class="brand"><img class="mark" src="/logos/Hologram_Logomark_White.svg" alt="" width="32" height="32"><img class="word" src="/logos/Hologram_Wordmark_White.svg" alt="Hologram" width="172" height="16"><span class="hub">Card art</span></span></header>
  <main class="lab" id="lab"></main>
</div>
<script type="module">
import * as R from "/render.mjs";

const data = await fetch("/data/models.json").then((r) => r.json());
const models = R.prepare(data.models, data.snapshot);
const pick = ["deepseek-ai/DeepSeek-V4.1-Flash", "Qwen/Qwen3.8-27B"].map((id) => models.find((m) => m.id === id)).filter(Boolean);
pick.push(models.find((m) => m.state !== "addressed"));

// Seeded from the manifest address: same bytes, same picture.
function prng(seed) {
  let h = 2166136261;
  for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
}
const W = 260, H = 120;
const svg = (cls, body) => `<svg class="art ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">${body}</svg>`;
const f = (n) => n.toFixed(1);

const VARIANTS = [
  {
    key: "mesh", name: "A · Sovereign mesh",
    note: "Independent nodes, each linked to its nearest peers. One node carries the address. Reads as a federated network with no centre.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), n = 26, pts = [];
      for (let i = 0; i < n; i++) pts.push([40 + r() * (W - 50), 8 + r() * (H - 16)]);
      let lines = "";
      pts.forEach((p, i) => {
        const near = pts.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1]), j]).sort((a, b) => a[0] - b[0]).slice(1, 3);
        for (const [, j] of near) if (j > i || true) lines += `M${f(p[0])} ${f(p[1])}L${f(pts[j][0])} ${f(pts[j][1])}`;
      });
      const hub = pts.reduce((a, b) => (b[0] > a[0] ? b : a));
      return svg("v-mesh", `<path class="ln" d="${lines}" stroke-width=".6" opacity="${lit ? .16 : .08}"/>` +
        pts.map((p) => `<circle class="nd" cx="${f(p[0])}" cy="${f(p[1])}" r="1.6" opacity="${lit ? .35 : .15}"/>`).join("") +
        (lit ? `<circle class="hot" cx="${f(hub[0])}" cy="${f(hub[1])}" r="2.4" opacity=".9"/><circle class="hotln" cx="${f(hub[0])}" cy="${f(hub[1])}" r="6" stroke-width=".6" opacity=".4"/>` : ""));
    },
  },
  {
    key: "lattice", name: "B · Address lattice",
    note: "A fixed grid where the address bits light the nodes and join lit neighbours. Every model is a unique circuit on the same substrate.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), cols = 16, rows = 7, gx = W / cols, gy = H / rows;
      const on = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) on.push(lit && r() < 0.42);
      let d = "", nodes = "";
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x, cx = gx * (x + .5), cy = gy * (y + .5);
        if (on[i] && x < cols - 1 && on[i + 1]) d += `M${f(cx)} ${f(cy)}H${f(cx + gx)}`;
        if (on[i] && y < rows - 1 && on[i + cols]) d += `M${f(cx)} ${f(cy)}V${f(cy + gy)}`;
        nodes += `<circle class="nd" cx="${f(cx)}" cy="${f(cy)}" r="${on[i] ? 1.7 : .9}" opacity="${on[i] ? .38 : .12}"/>`;
      }
      return svg("v-lattice", `<path class="ln" d="${d}" stroke-width=".8" opacity=".2"/>${nodes}`);
    },
  },
  {
    key: "orbits", name: "C · Orbits",
    note: "Concentric rings around the model with peers at positions set by the address. Calm, centred on the logo, suggests replication around one identity.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), cx = W - 34, cy = H / 2;
      let rings = "", pts = "";
      [22, 38, 56, 78, 104].forEach((rad, k) => {
        rings += `<circle class="ln" cx="${cx}" cy="${cy}" r="${rad}" stroke-width=".6" opacity="${.14 - k * .018}"/>`;
        const count = k + 2;
        for (let i = 0; i < count; i++) {
          const a = r() * Math.PI * 2;
          pts += `<circle class="${lit && k === 1 && i === 0 ? "hot" : "nd"}" cx="${f(cx + Math.cos(a) * rad)}" cy="${f(cy + Math.sin(a) * rad)}" r="${lit ? 2 : 1.4}" opacity="${lit ? .45 - k * .05 : .15}"/>`;
        }
      });
      return svg("v-orbits", rings + pts);
    },
  },
  {
    key: "signature", name: "D · Address signature",
    note: "The 64 digits of the manifest address drawn as fine bars. Literal and honest: the texture is the proof. Queued models show an empty rule.",
    draw(m, lit) {
      const hex = (m.manifest || "").split(":")[1] || "", n = 64, step = (W - 40) / n;
      let d = "";
      for (let i = 0; i < n; i++) {
        const v = lit ? parseInt(hex[i] || "0", 16) / 15 : 0.05;
        const h = 8 + v * (H - 30);
        const x = 40 + i * step;
        d += `M${f(x)} ${f((H - h) / 2)}V${f((H + h) / 2)}`;
      }
      return svg("v-signature", `<path class="ln" d="${d}" stroke-width="1" opacity="${lit ? .16 : .08}"/>`);
    },
  },
  {
    key: "traces", name: "E · Routed traces",
    note: "Orthogonal paths entering from the edge and terminating in nodes, like a board carrying signals. Sharp and technical.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), lanes = 9;
      let d = "", ends = "";
      for (let i = 0; i < lanes; i++) {
        let y = 8 + i * ((H - 16) / (lanes - 1)), x = W;
        const stop = 60 + r() * (W - 110);
        d += `M${x} ${f(y)}`;
        const bendX = stop + (W - stop) * (0.3 + r() * 0.4);
        d += `H${f(bendX)}`;
        const ny = Math.max(6, Math.min(H - 6, y + (r() < .5 ? -1 : 1) * (8 + r() * 12)));
        d += `L${f(bendX - Math.abs(ny - y))} ${f(ny)}H${f(stop)}`;
        ends += `<circle class="${lit && i === 4 ? "hot" : "nd"}" cx="${f(stop)}" cy="${f(ny)}" r="2" opacity="${lit ? .5 : .15}"/>`;
      }
      return svg("v-traces", `<path class="ln" d="${d}" stroke-width=".7" opacity="${lit ? .18 : .08}"/>${ends}`);
    },
  },
  {
    key: "tri", name: "G · Faceted mesh",
    note: "A triangulated surface with a few facets lit by the address. Crystalline and sharp, the closest in spirit to a premium faceted texture.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), cols = 9, rows = 4, gx = W / (cols - 1), gy = H / (rows - 1);
      const p = [];
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) p.push([x * gx + (r() - .5) * gx * .5, y * gy + (y && y < rows - 1 ? (r() - .5) * gy * .5 : 0)]);
      let edges = "", faces = "";
      for (let y = 0; y < rows - 1; y++) for (let x = 0; x < cols - 1; x++) {
        const a = p[y * cols + x], b = p[y * cols + x + 1], c = p[(y + 1) * cols + x], d = p[(y + 1) * cols + x + 1];
        for (const t of [[a, b, d], [a, d, c]]) {
          const path = `M${t.map((q) => `${f(q[0])} ${f(q[1])}`).join("L")}Z`;
          edges += path;
          const v = r();
          if (lit && v < .35) faces += `<path class="nd" d="${path}" opacity="${f(.02 + v * .12)}"/>`;
        }
      }
      return svg("v-tri", `${faces}<path class="ln" d="${edges}" stroke-width=".5" opacity="${lit ? .14 : .07}"/>`);
    },
  },
  {
    key: "hex", name: "H · Sovereign cells",
    note: "A honeycomb of territories. The address claims a few cells and one is marked green. Each cell independent, together one fabric.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), s = 13, w = Math.sqrt(3) * s;
      let outline = "", fill = "";
      let hot = lit;
      for (let row = 0; row * s * 1.5 < H + s; row++) for (let col = 0; col * w < W + w; col++) {
        const cx = col * w + (row % 2 ? w / 2 : 0), cy = row * s * 1.5;
        const pts = Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 180 * (60 * k - 30); return `${f(cx + s * Math.cos(a))} ${f(cy + s * Math.sin(a))}`; });
        const d = `M${pts.join("L")}Z`;
        outline += d;
        const v = r();
        if (lit && v < .12) {
          const green = hot && cx > W * .45 && v < .05;
          if (green) hot = false;
          fill += `<path class="${green ? "hot" : "nd"}" d="${d}" opacity="${green ? .22 : f(.05 + v * .6)}"/>`;
        }
      }
      return svg("v-hex", `${fill}<path class="ln" d="${outline}" stroke-width=".5" opacity="${lit ? .12 : .06}"/>`);
    },
  },
  {
    key: "globe", name: "I · Planetary network",
    note: "A wireframe sphere behind the logo with nodes and arcs on its surface. Global reach without a centre of control.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), cx = W - 36, cy = H / 2, R0 = 78;
      let grid = "";
      for (let k = 1; k < 6; k++) grid += `<ellipse class="ln" cx="${cx}" cy="${cy}" rx="${f(R0 * Math.sin(k * Math.PI / 6))}" ry="${R0}" stroke-width=".5" opacity=".12"/>`;
      for (let k = 1; k < 6; k++) { const y = cy + R0 * Math.cos(k * Math.PI / 6); const rx = R0 * Math.sin(k * Math.PI / 6); grid += `<path class="ln" d="M${f(cx - rx)} ${f(y)}H${f(cx + rx)}" stroke-width=".5" opacity=".12"/>`; }
      grid += `<circle class="ln" cx="${cx}" cy="${cy}" r="${R0}" stroke-width=".6" opacity=".16"/>`;
      const nodes = Array.from({ length: 9 }, () => { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * R0 * .92; return [cx + Math.cos(a) * d, cy + Math.sin(a) * d]; });
      let arcs = "";
      if (lit) for (let i = 1; i < nodes.length; i++) { const [a, b] = [nodes[i - 1], nodes[i]]; const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 - 18; arcs += `M${f(a[0])} ${f(a[1])}Q${f(mx)} ${f(my)} ${f(b[0])} ${f(b[1])}`; }
      return svg("v-globe", `${grid}<path class="ln" d="${arcs}" stroke-width=".6" opacity=".22"/>` + nodes.map((q, i) => `<circle class="${lit && i === 0 ? "hot" : "nd"}" cx="${f(q[0])}" cy="${f(q[1])}" r="1.8" opacity="${lit ? .5 : .15}"/>`).join(""));
    },
  },
  {
    key: "hubs", name: "J · Federation",
    note: "A few sovereign hubs, each with its own cluster, joined by long links. The literal picture of federated nodes.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), hubs = [[W * .42, H * .3], [W * .66, H * .72], [W * .9, H * .35]].map(([x, y]) => [x + (r() - .5) * 20, y + (r() - .5) * 16]);
      let d = "", nodes = "";
      hubs.forEach((h, i) => {
        const next = hubs[(i + 1) % hubs.length];
        d += `M${f(h[0])} ${f(h[1])}L${f(next[0])} ${f(next[1])}`;
        for (let k = 0; k < 7; k++) {
          const a = r() * Math.PI * 2, dist = 10 + r() * 22, x = h[0] + Math.cos(a) * dist, y = h[1] + Math.sin(a) * dist;
          d += `M${f(h[0])} ${f(h[1])}L${f(x)} ${f(y)}`;
          nodes += `<circle class="nd" cx="${f(x)}" cy="${f(y)}" r="1.2" opacity="${lit ? .35 : .14}"/>`;
        }
        nodes += `<circle class="${lit && i === 2 ? "hot" : "nd"}" cx="${f(h[0])}" cy="${f(h[1])}" r="3" opacity="${lit ? .7 : .18}"/><circle class="ln" cx="${f(h[0])}" cy="${f(h[1])}" r="7" stroke-width=".5" opacity="${lit ? .25 : .08}"/>`;
      });
      return svg("v-hubs", `<path class="ln" d="${d}" stroke-width=".5" opacity="${lit ? .18 : .08}"/>${nodes}`);
    },
  },
  {
    key: "flow", name: "K · Signal field",
    note: "Parallel lines bent by the address, like a field carrying information. Soft motion, no nodes, very quiet.",
    draw(m, lit) {
      const hex = (m.manifest || m.id).replace(/[^0-9a-f]/g, "").padEnd(16, "0");
      const amp = lit ? 4 + parseInt(hex[0], 16) : 2, freq = .02 + parseInt(hex[1], 16) / 600, phase = parseInt(hex.slice(2, 4), 16) / 40;
      let d = "";
      for (let i = 0; i < 18; i++) {
        const y0 = 4 + i * (H - 8) / 17;
        d += `M40 ${f(y0)}`;
        for (let x = 44; x <= W; x += 4) d += `L${x} ${f(y0 + Math.sin(x * freq + phase + i * .35) * amp * (x / W))}`;
      }
      return svg("v-flow", `<path class="ln" d="${d}" stroke-width=".6" opacity="${lit ? .16 : .07}"/>`);
    },
  },
  {
    key: "halftone", name: "L · Density field",
    note: "A halftone of dots whose size follows the address, dense at the edge and dissolving inward. Minimal and print-like.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), step = 8;
      let dotsOut = "";
      for (let y = step / 2; y < H; y += step) for (let x = step / 2; x < W; x += step) {
        const t = x / W, v = lit ? t * t * (.5 + r() * .5) : t * t * .5;
        if (v < .05) continue;
        dotsOut += `<circle class="nd" cx="${x}" cy="${y}" r="${f(v * 3)}" opacity="${lit ? .3 : .12}"/>`;
      }
      return svg("v-halftone", dotsOut);
    },
  },
  {
    key: "vault", name: "M · Sovereign perimeter",
    note: "Nested rounded squares closing around the logo, with one breach marked by the address. Suggests a self-held, verifiable enclosure.",
    draw(m, lit) {
      const r = prng(m.manifest || m.id), cx = W - 34, cy = H / 2;
      let d = "";
      [20, 34, 50, 68, 88, 110].forEach((s, k) => {
        d += `<rect class="ln" x="${f(cx - s)}" y="${f(cy - s)}" width="${f(s * 2)}" height="${f(s * 2)}" rx="${f(4 + k * 2)}" stroke-width=".6" opacity="${f((lit ? .2 : .1) - k * .02)}" stroke-dasharray="${k % 2 ? "2 3" : "none"}"/>`;
      });
      const side = Math.floor(r() * 4), s = 50, t = (r() - .5) * s * 1.4;
      const [x, y] = [[cx + t, cy - s], [cx + s, cy + t], [cx + t, cy + s], [cx - s, cy + t]][side];
      return svg("v-vault", d + (lit ? `<circle class="hot" cx="${f(x)}" cy="${f(y)}" r="2.4" opacity=".9"/>` : ""));
    },
  },
  {
    key: "live", name: "Live: faceted mesh",
    note: "The version shipped on the site, from render.mjs.",
    draw(m, lit) { return R.art(m.manifest || m.id, lit); },
  },
];

const lab = document.querySelector("#lab");
lab.innerHTML = VARIANTS.map((v) => `<section class="panel variant">
  <header><h2>${v.name}</h2><p>${v.note}</p></header>
  <div class="grid">${pick.map((m) => R.card(m, { base: "/" }).replace(/<svg class="art[\s\S]*?<\/svg>/, v.draw(m, m.state === "addressed"))).join("")}</div>
</section>`).join("");
</script>
</body>
</html>
