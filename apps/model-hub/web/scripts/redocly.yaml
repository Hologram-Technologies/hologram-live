# Lint rules for deploy/openapi.json. The gate is zero problems, so every rule that is relaxed is relaxed here, in
# the open, with the reason written down. Run: npx @redocly/cli lint openapi.json
extends:
  - recommended

rules:
  # `/v2/` is not our naming: the OCI distribution specification defines the version check as a GET on exactly that
  # path, trailing slash included, and every client sends it that way. Renaming it would break `docker`, `ollama`,
  # `oras`, `skopeo` and `crane` at once.
  no-path-trailing-slash: off

  # Two routes answer only a redirect, by design, and can never answer 2xx:
  #   /api/models/{owner}/{name}/xet-read-token/{revision}  hands a Xet client back to Hugging Face, which owns the
  #                                                         token; the hub issues nothing and so returns only 307.
  # A 2xx invented for them would be a lie in the contract.
  operation-2xx-response: off

  # Everything else stays on, including the two rules that found real gaps in the first draft:
  # operation-4xx-response (18 operations documented only their happy path) and
  # no-invalid-media-type-examples (5 examples did not match their schema, one because the probe had truncated a
  # JSON body into a string and one because the archive schema was missing four top-level fields).
  operation-4xx-response: error
  no-invalid-media-type-examples: error
  no-unused-components: error
  security-defined: error
  operation-operationId: error
  operation-summary: error
  operation-description: error
  operation-tag-defined: error
  tag-description: error
  info-license: error
  no-server-trailing-slash: error
