# Verbatim from the reference's deployment guide, "Deploy your registry using a
# Compose file": distribution/distribution v3.1.1,
# docs/content/about/deploying.md, lines 498 to 515. compose-swap.sh changes
# only `image:` and replaces `/path`, as the guide tells the reader to.
services:
  registry:
    restart: always
    image: registry:3
    ports:
      - 5000:5000
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/domain.crt
      REGISTRY_HTTP_TLS_KEY: /certs/domain.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
    volumes:
      - /path/data:/var/lib/registry
      - /path/certs:/certs
      - /path/auth:/auth
