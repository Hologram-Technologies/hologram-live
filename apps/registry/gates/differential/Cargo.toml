[package]
name = "differential"
version = "0.0.0"
edition = "2021"
publish = false
description = "Gate B: play one scripted session against the reference registry and against Hologram Registry, and compare."

[dependencies]
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
