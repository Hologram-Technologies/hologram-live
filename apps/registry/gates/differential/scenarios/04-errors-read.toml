name = "04-errors-read"
summary = "The read path's errors: status, code, message and detail."
repo = "gate-b/errors"

[[step]]
id = "seed-start"
method = "POST"
path = "/v2/{repo}/blobs/uploads/"
capture = { upload = "header:location" }

[[step]]
id = "seed-put"
method = "PUT"
url = "{upload}"
headers = { "content-type" = "application/octet-stream" }
query = { digest = "{sha256:seed=3:len=1024}" }
body = 'bytes:seed=3:len=1024'

[[step]]
id = "blob-unknown"
method = "GET"
path = "/v2/{repo}/blobs/{sha256:seed=99:len=8}"

[[step]]
id = "blob-unknown-head"
method = "HEAD"
path = "/v2/{repo}/blobs/{sha256:seed=99:len=8}"

[[step]]
id = "blob-other-repo"
method = "GET"
path = "/v2/gate-b/elsewhere/blobs/{sha256:seed=3:len=1024}"

[[step]]
id = "manifest-unknown-tag"
method = "GET"
path = "/v2/{repo}/manifests/nope"

[[step]]
id = "manifest-unknown-digest"
method = "GET"
path = "/v2/{repo}/manifests/{sha256:seed=99:len=8}"

[[step]]
id = "manifest-unknown-repo"
method = "GET"
path = "/v2/gate-b/never/manifests/latest"

[[step]]
id = "tags-unknown-repo"
method = "GET"
path = "/v2/gate-b/never/tags/list"

[[step]]
id = "digest-invalid-blob"
method = "GET"
path = "/v2/{repo}/blobs/sha256:abc"

[[step]]
id = "digest-invalid-manifest"
method = "GET"
path = "/v2/{repo}/manifests/sha256:abc"

[[step]]
id = "digest-unknown-algorithm"
method = "GET"
path = "/v2/{repo}/blobs/md5:d41d8cd98f00b204e9800998ecf8427e"

[[step]]
id = "tag-invalid"
method = "GET"
path = "/v2/{repo}/manifests/.bad"
