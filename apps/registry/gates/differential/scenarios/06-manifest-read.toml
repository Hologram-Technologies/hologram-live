name = "06-manifest-read"
summary = "One image, read by tag and by digest, with and without a matching Accept."
repo = "gate-b/manifest"

[manifests.image]
config = "seed=2:len=512"
layers = ["seed=3:len=1024"]

[[step]]
id = "config-start"
method = "POST"
path = "/v2/{repo}/blobs/uploads/"
capture = { upload = "header:location" }

[[step]]
id = "config-put"
method = "PUT"
url = "{upload}"
headers = { "content-type" = "application/octet-stream" }
query = { digest = "{sha256:seed=2:len=512}" }
body = 'bytes:seed=2:len=512'

[[step]]
id = "layer-start"
method = "POST"
path = "/v2/{repo}/blobs/uploads/"
capture = { upload = "header:location" }

[[step]]
id = "layer-put"
method = "PUT"
url = "{upload}"
headers = { "content-type" = "application/octet-stream" }
query = { digest = "{sha256:seed=3:len=1024}" }
body = 'bytes:seed=3:len=1024'

[[step]]
id = "put"
method = "PUT"
path = "/v2/{repo}/manifests/v1"
headers = { "content-type" = "application/vnd.oci.image.manifest.v1+json" }
body = 'manifest:image'

[[step]]
id = "get-tag"
method = "GET"
path = "/v2/{repo}/manifests/v1"
headers = { accept = "application/vnd.oci.image.manifest.v1+json" }

[[step]]
id = "head-tag"
method = "HEAD"
path = "/v2/{repo}/manifests/v1"
headers = { accept = "application/vnd.oci.image.manifest.v1+json" }

[[step]]
id = "get-digest"
method = "GET"
path = "/v2/{repo}/manifests/{manifest:image}"
headers = { accept = "application/vnd.oci.image.manifest.v1+json" }

[[step]]
id = "head-digest"
method = "HEAD"
path = "/v2/{repo}/manifests/{manifest:image}"

[[step]]
id = "accept-excludes"
method = "GET"
path = "/v2/{repo}/manifests/v1"
headers = { accept = "application/vnd.docker.distribution.manifest.v2+json" }

[[step]]
id = "accept-any"
method = "GET"
path = "/v2/{repo}/manifests/v1"

[[step]]
id = "if-none-match"
method = "GET"
path = "/v2/{repo}/manifests/v1"
headers = { if-none-match = "\"{manifest:image}\"" }

[state]
catalog = true
tags = ["{repo}"]
