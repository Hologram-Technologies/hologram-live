name = "10-mount"
summary = "Cross-repository mount: a hit, a miss, no from, a from that does not exist."
repo = "gate-b/mount"

[[step]]
id = "source-start"
method = "POST"
path = "/v2/{repo}/blobs/uploads/"
capture = { upload = "header:location" }

[[step]]
id = "source-put"
method = "PUT"
url = "{upload}"
headers = { "content-type" = "application/octet-stream" }
query = { digest = "{sha256:seed=3:len=1024}" }
body = 'bytes:seed=3:len=1024'

[[step]]
id = "hit"
method = "POST"
path = "/v2/gate-b/mount-target/blobs/uploads/"
query = { mount = "{sha256:seed=3:len=1024}", from = "{repo}" }

[[step]]
id = "head-after-hit"
method = "HEAD"
path = "/v2/gate-b/mount-target/blobs/{sha256:seed=3:len=1024}"

[[step]]
id = "miss"
method = "POST"
path = "/v2/gate-b/mount-target/blobs/uploads/"
query = { mount = "{sha256:seed=99:len=8}", from = "{repo}" }

[[step]]
id = "no-from"
method = "POST"
path = "/v2/gate-b/mount-other/blobs/uploads/"
query = { mount = "{sha256:seed=3:len=1024}" }

[[step]]
id = "head-after-no-from"
method = "HEAD"
path = "/v2/gate-b/mount-other/blobs/{sha256:seed=3:len=1024}"

[[step]]
id = "from-unknown-repo"
method = "POST"
path = "/v2/gate-b/mount-third/blobs/uploads/"
query = { mount = "{sha256:seed=3:len=1024}", from = "gate-b/never" }

[[step]]
id = "mount-bad-digest"
method = "POST"
path = "/v2/gate-b/mount-target/blobs/uploads/"
query = { mount = "sha256:abc", from = "{repo}" }

[state]
catalog = true
