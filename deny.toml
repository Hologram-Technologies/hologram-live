# Licence policy. `cargo deny check licenses` is blocking in CI: the crate is
# `MIT OR Apache-2.0`, and nothing may enter the graph that cannot ship under
# both without a recorded exception.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # third_party/dcbor and dcbor-derive: permissive, OSI-approved.
    "BSD-2-Clause-Patent",
    # webpki-root-certs: the root certificate data, permissive.
    "CDLA-Permissive-2.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = [
    # Burn 0.18 uses colored only for tensor diagnostics. It remains an
    # unmodified, off-by-default transitive dependency; MPL-2.0's obligations
    # stay scoped to that crate's own source files.
    { allow = ["MPL-2.0"], crate = "colored" },
    # Burn-LM's cache-directory helper reaches option-ext through dirs. The
    # server calls only local checkpoint APIs, but the published crate enables
    # this graph. Keep the exception exact instead of admitting MPL globally.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
